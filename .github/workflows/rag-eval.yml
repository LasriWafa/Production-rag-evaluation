name: RAG Evaluation CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate:
    name: Evaluate RAG Pipeline (Faithfulness & Relevancy)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install and Start Ollama Server
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is ready!"
              break
            fi
            echo "Waiting for Ollama to initialize..."
            sleep 2
          done

      - name: Pull CI Models
        run: |
          ollama pull nomic-embed-text
          ollama pull qwen2.5:0.5b

      - name: Run RAG Evaluation Harness (Quality Gate)
        run: |
          python -u evaluate.py --limit 3 --model qwen2.5:0.5b

      - name: Print Ollama Logs on Failure
        if: failure()
        run: |
          if [ -f ollama.log ]; then
            cat ollama.log
          fi
